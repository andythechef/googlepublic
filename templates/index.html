<!DOCTYPE html>
<html>
<head>
    <title>Shopping List Demo</title>
</head>
<body>
    <h1>🛒 Shopping List</h1>
    <form method="POST">
        <input type="text" name="item" placeholder="Add an item..." required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for item in items %}
            <li>{{ item }}</li>
        {% endfor %}
    </ul>
</body>
</html>
